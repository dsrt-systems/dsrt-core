[project]
name = "dsrt-core"
version = "1.0.0"
description = "DSRT Core — Model-Independent Intelligence Execution System"
requires-python = ">=3.11"
dependencies = [
    # --- Web framework ---
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "python-multipart>=0.0.9",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "asyncpg>=0.29.0,<1.0",
    "alembic>=1.13.0,<2.0",
    "pgvector>=0.3.0,<1.0",

    # --- Validation & serialization ---
    "pydantic>=2.7.0,<3.0",
    "pydantic-settings>=2.3.0,<3.0",

    # --- Auth & security ---
    "python-jose[cryptography]>=3.3.0,<4.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "cryptography>=42.0.0,<44.0",

    # --- AI/LLM providers ---
    "openai>=1.30.0,<2.0",
    "anthropic>=0.28.0,<1.0",
    "google-generativeai>=0.7.0,<1.0",
    "tiktoken>=0.7.0,<1.0",

    # --- HTTP & networking ---
    "httpx>=0.27.0,<1.0",
    "aiohttp>=3.9.0,<4.0",

    # --- Storage ---
    "boto3>=1.34.0,<2.0",          # S3-compatible (Supabase Storage)

    # --- Redis / caching ---
    "redis[hiredis]>=5.0.0,<6.0",

    # --- Observability ---
    "structlog>=24.2.0,<25.0",

    # --- Utilities ---
    "python-dotenv>=1.0.0,<2.0",
    "orjson>=3.10.0,<4.0",
    "tenacity>=8.3.0,<9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",              # TestClient
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:jose.*",
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:pytest_asyncio.*",
    "ignore::RuntimeWarning",
    "ignore::pytest.PytestDeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.coverage.run]
source = ["core", "sdk"]
omit = ["tests/*", "migrations/*"]

[tool.coverage.report]
precision = 2
show_missing = true