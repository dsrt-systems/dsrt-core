# =============================================================================
# DSRT Core — Local Development Stack
# Usage: docker compose up -d
# =============================================================================

version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dsrt-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - dsrt-net

  # Supabase runs externally (cloud). For local dev, use:
  # npx supabase start  (requires Supabase CLI)
  # This connects to your Supabase cloud project via .env

volumes:
  redis-data:

networks:
  dsrt-net:
    driver: bridge